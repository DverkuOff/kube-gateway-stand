name: image

# Builds the Fluentd image (amd64 + arm64) and publishes it to GHCR.
on:
  push:
    branches: [main]
    paths:
      - images/fluentd/**
      - versions.env
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fluentd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Load pinned versions
        run: grep -E '^(FLUENTD_BASE_IMAGE|FLUENT_PLUGIN_LOKI_VERSION|FLUENT_PLUGIN_LOKI_SHA256|FLUENTD_IMAGE|FLUENTD_IMAGE_TAG)=' versions.env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: images/fluentd
          platforms: linux/amd64
          load: true
          tags: fluentd-loki:smoke
          build-args: |
            FLUENTD_BASE_IMAGE=${{ env.FLUENTD_BASE_IMAGE }}
            FLUENT_PLUGIN_LOKI_VERSION=${{ env.FLUENT_PLUGIN_LOKI_VERSION }}
            FLUENT_PLUGIN_LOKI_SHA256=${{ env.FLUENT_PLUGIN_LOKI_SHA256 }}

      - name: Smoke test — the loki output plugin loads
        run: |
          docker run --rm --entrypoint fluentd \
            -v "$PWD/images/fluentd/smoke.conf:/tmp/smoke.conf:ro" \
            fluentd-loki:smoke --dry-run -c /tmp/smoke.conf -p /fluentd/plugins

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: images/fluentd
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.FLUENTD_IMAGE }}:${{ env.FLUENTD_IMAGE_TAG }}
            ${{ env.FLUENTD_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            FLUENTD_BASE_IMAGE=${{ env.FLUENTD_BASE_IMAGE }}
            FLUENT_PLUGIN_LOKI_VERSION=${{ env.FLUENT_PLUGIN_LOKI_VERSION }}
            FLUENT_PLUGIN_LOKI_SHA256=${{ env.FLUENT_PLUGIN_LOKI_SHA256 }}
