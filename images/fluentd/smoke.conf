# Used by CI only: fluentd --dry-run must load the loki output from /fluentd/plugins.
<source>
  @type sample
  tag smoke
  sample {"message":"hello"}
</source>
<match smoke>
  @type loki
  url "http://loki.logging.svc:3100"
  extra_labels {"job":"smoke"}
  <buffer>
    @type memory
  </buffer>
</match>
