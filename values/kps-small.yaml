# PROFILE=small (2 vCPU / 4 GB): applied on top of values/kps.yaml.
prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 1d
    retentionSize: 1GB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi

grafana:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 384Mi
