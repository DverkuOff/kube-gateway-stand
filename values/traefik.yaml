# Traefik (chart traefik/traefik) as the Gateway API controller.
# Every key below exists in the chart's values.yaml of the pinned version (see versions.env).
# Set by scripts/30-platform.sh:
#   image.tag                                       = TRAEFIK_VERSION
#   providers.kubernetesGateway.statusAddress.ip    = NODE_IP (copied into Gateway.status.addresses)

deployment:
  kind: Deployment
  replicas: 1

# hostPort 80/443 is held by the running pod, so the new pod can start only after the old one stops.
# The chart default (maxUnavailable 0 / maxSurge 1) would hang the rollout.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Published on the node address through hostPort (CNI portmap). Entry point ports equal the
# Gateway listener ports (80/443): Traefik maps a listener to the entry point with the same port.
ports:
  web:
    port: 80
    hostPort: 80
    exposedPort: 80
  websecure:
    port: 443
    hostPort: 443
    exposedPort: 443

# No cloud load balancer: ClusterIP only (LoadBalancer would stay Pending forever).
service:
  spec:
    type: ClusterIP

providers:
  kubernetesGateway:
    enabled: true
    statusAddress:
      ip: ""                # set to NODE_IP by the deploy script
      service:
        enabled: false      # do not copy the (empty) Service status
  kubernetesCRD:
    enabled: true           # Middleware (rate limit) referenced from HTTPRoute via ExtensionRef
  kubernetesIngress:
    enabled: false

ingressClass:
  enabled: false

# GatewayClass and Gateway are managed in charts/platform.
gateway:
  enabled: false
gatewayClass:
  enabled: false

# The dashboard is not published anywhere; keep it off to reduce the surface.
api:
  dashboard: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  format: json
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep
        User-Agent: keep
        X-Forwarded-For: keep

metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    # 0.3 and 1.2 are the Apdex thresholds of the official Traefik dashboard (Grafana 17347).
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.3,0.5,1,1.2,2.5,5"
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      # Traefik's own "service" label (the backend) would otherwise clash with the target label
      # "service" (traefik-metrics) and be renamed to exported_service; dashboards and alerts
      # query service="...-svc-web-web-v1-0@kubernetesgateway".
      honorLabels: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Chart defaults are kept (non-root 65532, read-only rootfs, drop ALL, seccomp RuntimeDefault).
# The safe sysctl lets the non-root process bind 80/443 inside the pod network namespace
# without NET_BIND_SERVICE, independent of the container runtime defaults.
podSecurityContext:
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
