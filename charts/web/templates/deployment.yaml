{{- range $version, $cfg := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-{{ $version }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
    app.kubernetes.io/version: {{ $version }}
spec:
  replicas: {{ $cfg.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "web.selector" (dict "version" $version) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web.labels" $ | nindent 8 }}
        app.kubernetes.io/version: {{ $version }}
      annotations:
        checksum/config: {{ include "web.nginxConf" (dict "version" $version "root" $) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ $.Values.nginx.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # let the gateway drop the endpoint before nginx stops
              sleep:
                seconds: 5
          resources:
            {{- toYaml $.Values.nginx.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
        {{- if $.Values.exporter.enabled }}
        - name: exporter
          image: {{ $.Values.exporter.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
            - --web.listen-address=:9113
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.exporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: web-{{ $version }}-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
